name: Beta Release

on:
  push:
    branches: [testing, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (e.g., v1.0.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Auto-generate version from branch and commit
            BRANCH="${GITHUB_REF#refs/heads/}"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            DATE=$(date +%Y%m%d)
            echo "VERSION=v0.0.0-${BRANCH}.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}"
          go build -ldflags "${LDFLAGS}" -o podx-${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: podx-${{ matrix.suffix }}
          path: podx-${{ matrix.suffix }}

  release:
    name: Create Beta Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            DATE=$(date +%Y%m%d)
            echo "VERSION=v0.0.0-${BRANCH}.${DATE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in dist/*/; do
            cp "$dir"* release/
          done
          cd release
          sha256sum * > checksums.txt

      - name: Delete existing beta release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes 2>/dev/null || true
          git push origin :refs/tags/beta 2>/dev/null || true

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta
          name: "🧪 PODX Beta - ${{ steps.version.outputs.VERSION }}"
          body: |
            ## ⚠️ Beta Release

            This is a **beta/development** release from the `${{ github.ref_name }}` branch.

            **Version:** `${{ steps.version.outputs.VERSION }}`
            **Commit:** `${{ github.sha }}`
            **Built:** `${{ github.event.head_commit.timestamp }}`

            > **Warning:** This release may contain bugs and is not recommended for production use.

            ---

            ## Installation

            ### Linux / macOS (Beta)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/dwirx/podx/main/install.sh | bash -s -- --beta
            ```

            ### Windows (PowerShell as Admin)
            ```powershell
            iwr -useb https://raw.githubusercontent.com/dwirx/podx/main/install.ps1 | iex -Args "--beta"
            ```

            ### Manual Download
            | Platform | File |
            |----------|------|
            | Linux AMD64 | `podx-linux-amd64` |
            | Linux ARM64 | `podx-linux-arm64` |
            | macOS Intel | `podx-darwin-amd64` |
            | macOS Apple Silicon | `podx-darwin-arm64` |
            | Windows AMD64 | `podx-windows-amd64.exe` |
            | Windows ARM64 | `podx-windows-arm64.exe` |

            ---

            ## What's New

            See [commit history](https://github.com/dwirx/podx/commits/${{ github.ref_name }}) for changes.

          files: release/*
          draft: false
          prerelease: true
