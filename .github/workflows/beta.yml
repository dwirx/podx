name: Beta Release

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Get version info
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE=$(date +%Y%m%d)
          VERSION="v0.0.0-beta.${DATE}.${SHORT_SHA}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o podx-linux-amd64 .

      - name: Build Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o podx-linux-arm64 .

      - name: Build macOS Intel
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o podx-darwin-amd64 .

      - name: Build macOS ARM64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o podx-darwin-arm64 .

      - name: Build Windows AMD64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o podx-windows-amd64.exe .

      - name: Create checksums
        run: |
          sha256sum podx-* > checksums.txt
          cat checksums.txt

      - name: Delete existing beta release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes 2>/dev/null || true
          git push origin :refs/tags/beta 2>/dev/null || true

      - name: Create Beta Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta
          name: "🧪 PODX Beta - ${{ steps.version.outputs.VERSION }}"
          body: |
            ## ⚠️ Beta Release (Pre-release)

            **Version:** `${{ steps.version.outputs.VERSION }}`
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            > ⚠️ This is a development release and may contain bugs.

            ---

            ## Installation

            ### Linux / macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/dwirx/podx/main/install.sh | bash -s -- --beta
            ```

            ### Windows (PowerShell)
            ```powershell
            iwr -useb https://raw.githubusercontent.com/dwirx/podx/main/install.ps1 | iex
            ```
            Then download `podx-windows-amd64.exe` from assets below.

            ### Manual Download
            | Platform | File |
            |----------|------|
            | Linux AMD64 | `podx-linux-amd64` |
            | Linux ARM64 | `podx-linux-arm64` |
            | macOS Intel | `podx-darwin-amd64` |
            | macOS Apple Silicon | `podx-darwin-arm64` |
            | Windows | `podx-windows-amd64.exe` |

            ---

            ## Features

            - 🔐 Password Encryption (AES-GCM)
            - 🔑 Age Key Encryption
            - 📂 Interactive TUI with File Browser
            - 🛡️ Security Checks & Pre-commit Hook
            - 🔄 Self-update

          files: |
            podx-linux-amd64
            podx-linux-arm64
            podx-darwin-amd64
            podx-darwin-arm64
            podx-windows-amd64.exe
            checksums.txt
          draft: false
          prerelease: true
